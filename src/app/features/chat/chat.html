<section class="w-full min-h bg-black">
  <div
    class="bg-gradient-to-br from-amber-900 via-amber-800 to-amber-900 w-full max-w-md mx-auto min-h-dvh text-amber-100 p-4 relative overflow-hidden flex flex-col shadow-2xl"
  >
    <!-- Fondo decorativo -->
    <div class="absolute inset-0 opacity-20 pointer-events-none">
      <div
        class="absolute top-0 left-0 w-64 h-64 bg-amber-400 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"
      ></div>
      <div
        class="absolute bottom-0 right-0 w-80 h-80 bg-purple-500 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"
      ></div>
    </div>

    <!-- Header del chat -->
    <div
      class="relative z-10 bg-amber-950/60 backdrop-blur-xl rounded-2xl p-4 mb-3 border border-amber-600/30 shadow-lg"
    >
      <div class="flex items-center justify-center gap-2">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        <h2 class="font-bold text-amber-100 text-center tracking-wide">💬 Chat global</h2>
        <span class="text-xs text-amber-300/70">en vivo</span>
      </div>
    </div>

    <!-- Contenedor de mensajes -->
    <div
      #chatContainer
      class="relative z-10 flex flex-col gap-4 p-4 bg-amber-950/20 backdrop-blur-sm rounded-2xl flex-1 overflow-y-auto max-h-[70vh] scroll-smooth shadow-inner border border-amber-700/20"
    >
      @for (msg of messages(); track msg.id) {
        <div class="flex flex-col gap-1">
          <!-- Nombre -->
          <span
            class="text-xs font-semibold px-2"
            [class.text-right]="msg.user_uid === currentUser()?.id"
            [class.text-amber-300]="msg.user_uid !== currentUser()?.id"
            [class.text-emerald-300]="msg.user_uid === currentUser()?.id"
          >
            {{ msg.users?.nombre }} {{ msg.users?.apellido }}
            <span class="text-[10px] text-amber-400/60 ml-1">• ahora</span>
          </span>

          <!-- Mensaje -->
          <div class="flex" [class.justify-end]="msg.user_uid === currentUser()?.id">
            <p
              class="px-4 py-2.5 rounded-2xl max-w-[80%] shadow-md transition-all duration-200 hover:scale-[1.02]"
              [class.bg-gradient-to-r]="msg.user_uid === currentUser()?.id"
              [class.from-emerald-600]="msg.user_uid === currentUser()?.id"
              [class.to-teal-600]="msg.user_uid === currentUser()?.id"
              [class.rounded-br-none]="msg.user_uid === currentUser()?.id"
              [class.text-white]="msg.user_uid === currentUser()?.id"
              [class.bg-amber-800/70]="msg.user_uid !== currentUser()?.id"
              [class.backdrop-blur-sm]="msg.user_uid !== currentUser()?.id"
              [class.rounded-bl-none]="msg.user_uid !== currentUser()?.id"
              [class.border]="msg.user_uid !== currentUser()?.id"
              [class.border-amber-600/30]="msg.user_uid !== currentUser()?.id"
            >
              {{ msg.mensaje }}
            </p>
          </div>
        </div>
      }

      <!-- Placeholder si no hay mensajes -->
      @if (messages().length === 0) {
        <div class="flex flex-col items-center justify-center h-full text-center opacity-50 py-12">
          <div class="text-4xl mb-2">💬</div>
          <p class="text-sm">No hay mensajes aún</p>
          <p class="text-xs">¡Sé el primero en escribir!</p>
        </div>
      }
    </div>

    <!-- Input y botón -->
    <div
      class="relative z-10 bg-amber-950/70 backdrop-blur-xl mt-3 rounded-2xl p-3 flex gap-3 shadow-xl border border-amber-600/30"
    >
      <input
        type="text"
        [(ngModel)]="newMessage"
        (keyup.enter)="send()"
        placeholder="Escribe un mensaje..."
        class="flex-1 bg-amber-900/60 text-amber-100 placeholder-amber-400/50 px-4 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all duration-200 border border-amber-700/30 focus:border-amber-500"
      />

      <button
        (click)="send()"
        class="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 transition-all duration-200 px-6 py-2.5 rounded-xl font-semibold shadow-md hover:shadow-lg active:scale-95 flex items-center gap-2"
      >
        <span>📨</span>
        <span>Enviar</span>
      </button>
    </div>
  </div>
</section>
