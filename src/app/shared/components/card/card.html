<div
  class="relative w-52 rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 cursor-pointer hover:-translate-y-1 transition-transform duration-200"
>
  <!-- Imagen -->
  <div (click)="redirigir()" class="relative aspect-[3/4]">
    <img [src]="imagen" alt="Diablo 4" class="w-full h-full object-cover" />

    <!-- Fade inferior -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-zinc-900/30 to-transparent"
    ></div>

    <!-- Badge Nuevo -->
    <span
      class="absolute top-2.5 left-2.5 bg-red-700 text-red-200 text-[10px] font-semibold uppercase tracking-widest px-2 py-0.5 rounded"
    >
      Nuevo
    </span>

    <!-- Título y pills encima del fade -->
    <div class="absolute bottom-0 left-0 right-0 p-3.5">
      <h2 class="font-black text-2xl text-amber-50 tracking-wide leading-none mb-2.5">
        {{ titulo }}
      </h2>

      <div class="flex items-center gap-2 flex-wrap">
        <!-- Jugadores -->
        <span
          class="flex items-center gap-1.5 text-[11px] font-medium text-zinc-400 bg-white/5 border border-white/10 rounded-full px-2.5 py-1"
        >
          <svg class="w-3 h-3 opacity-70" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z"
            />
          </svg>
          1 jugador
        </span>

        <!-- Offline -->
        <span
          class="flex items-center gap-1.5 text-[11px] font-medium text-amber-400 bg-amber-400/10 border border-amber-400/30 rounded-full px-2.5 py-1"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>
          Offline
        </span>
      </div>
    </div>
  </div>
</div>
